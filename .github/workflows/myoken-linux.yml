name: Myoken Linux isolation and smoke tests
on:
  push:
    branches: ['linux/**']
    paths:
      - 'linux/**'
      - 'src/Myoken.Core/**'
      - 'src/Myoken.Linux/**'
      - 'tests/Myoken.Linux.Tests/**'
      - 'tests/Myoken.Linux.Browser.Tests/**'
      - 'tests/Myoken.Linux.Viewer.Tests/**'
      - '.github/workflows/myoken-linux.yml'
  pull_request:
    branches: ['linux/ubuntu-gnome']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check isolation, compile and run core/session/browser/viewer policy checks
        run: bash linux/check.sh
      - name: Install headless display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1 libxrandr2 libxi6 libxcursor1 libgl1
      - name: Run X11 browser, viewer and fresh-process session regressions
        env:
          MYOKEN_TEST_OUTPUT: '${{ github.workspace }}/artifacts/linux-ui'
        run: bash linux/smoke.sh
      - name: Save generated-fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ui-generated-fixtures
          path: artifacts/linux-ui/*.png
          if-no-files-found: ignore
          retention-days: 14
